<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actividad de Nadar - Polimorfismo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        h1 { color: #0077b6; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; }
        th, td { border: 1px solid #cccccc; padding: 12px; text-align: left; }
        th { background-color: #0077b6; color: white; }
        tr:nth-child(even) { background-color: #e0f7fa; }
    </style>
</head>
<body>

<h1>Resultados de Actividades Acuáticas (Polimorfismo en Java)</h1>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Sumergirse</th>
        <th>Flotación</th>
        <th>Nadar Hacia</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="res, iterStat : ${resultados}">
        <td th:text="${iterStat.count}">1</td>
        <td th:text="${res.sumergirse}"></td>
        <td th:text="${res.flotar}"></td>
        <td th:text="${res.nadarHacia}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
